apiVersion: v2
name: ars
description: >-
  Helm chart for the ARS (Autonomous Relay System) and its backing services.
  Unlike deploy/ (the Jenkins-driven production chart), this chart is
  self-contained: it deploys MySQL and RabbitMQ alongside the app so a
  dev instance can be installed on any cluster with no externally supplied
  config files.
type: application
version: 0.2.0
appVersion: "1.42.1"
