{{- /*
One Deployment per worker pool in .Values.celeryworkers. Each pool consumes only
the queues in its `queues` value, so the `heavy` pool's replicas x concurrency is
the cluster-wide cap on concurrent memory-heavy work.
Beat runs in its own single-replica Deployment.
*/ -}}
{{- $root := . -}}
{{- range $name, $pool := .Values.celeryworkers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ars.fullname" $root }}-worker-{{ $name }}
  labels:
    {{- include "ars.labels" $root | nindent 4 }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/pool: {{ $name }}
spec:
  replicas: {{ $pool.replicas }}
  selector:
    matchLabels:
      {{- include "ars.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: worker
      app.kubernetes.io/pool: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "ars.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: worker
        app.kubernetes.io/pool: {{ $name }}
      annotations:
        checksum/settings: {{ include "ars.settingsChecksum" $root }}
    spec:
      {{- include "ars.podScheduling" $root | nindent 6 }}
      initContainers:
        - name: wait-for-mysql
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["/bin/wait-for", "{{ include "ars.mysqlHost" $root }}:{{ include "ars.mysqlPort" $root }}", "-t", "300"]
        - name: wait-for-rabbitmq
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["/bin/wait-for", "{{ include "ars.rabbitmqHost" $root }}:{{ include "ars.rabbitmqPort" $root }}", "-t", "300"]
      containers:
        - name: celeryworker
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - >-
              cd /ars/tr_sys &&
              celery -A tr_sys worker -l info
              -Q {{ $pool.queues }}
              -n {{ $name }}@%h
              --concurrency={{ $pool.concurrency }}
              --prefetch-multiplier=1
              {{- if $pool.maxTasksPerChild }}
              --max-tasks-per-child={{ $pool.maxTasksPerChild }}
              {{- end }}
              {{- if $pool.maxMemoryPerChildKb }}
              --max-memory-per-child={{ $pool.maxMemoryPerChildKb }}
              {{- end }}
          env:
            {{- include "ars.commonEnv" $root | nindent 12 }}
          volumeMounts:
            - name: settings
              mountPath: /ars/tr_sys/tr_sys/settings.py
              subPath: settings.py
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'celery.*worker' || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with $pool.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: settings
          configMap:
            name: {{ include "ars.fullname" $root }}-settings
{{- end }}