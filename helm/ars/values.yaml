# Dev-oriented defaults for the self-contained ARS chart.
#
# Everything needed for `helm install` on a plain cluster is here: in-cluster
# MySQL/Redis/RabbitMQ, dev credentials, and an app image name that matches a
# local `docker build -t relay_ars .` (load it into kind/minikube, or override
# image.repository/tag with an ECR image).
#
# The secrets block holds DEV-ONLY defaults. Override them (or set
# secrets.existingSecret) for any instance that is reachable by anyone else.

nameOverride: ""
fullnameOverride: ""

image:
  # The ARS app image, used by the web server, celery worker, celery beat and
  # the migration job. `relay_ars` matches the docker-compose build tag; for a
  # shared cluster point this at the ECR repo instead, e.g.
  # 853771734544.dkr.ecr.us-east-1.amazonaws.com/translator-ars
  repository: relay_ars
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Translator environment wiring (external HTTP services -- not deployed here)
env:
  # SmartAPI maturity level: production | staging | testing | development
  TR_ENV: development
  TR_APPRAISE: "https://answerappraiser.ci.transltr.io/get_appraisal"
  TR_NORMALIZER: "https://nodenorm-es.ci.transltr.io/get_normalized_nodes"
  TR_ANNOTATOR: "https://biothings.ncats.io/curie"
# Extra env vars appended verbatim to all app containers (list of EnvVar)
extraEnv: []

# OTLP trace export (tr_sys/tr_sys/otel_config.py). If the collector does not
# exist in your cluster the exporter just logs connection errors; harmless.
otel:
  jaegerHost: "http://jaeger-otel-collector.sri"
  jaegerPort: "4317"

django:
  debug: "true"
  allowedHosts: "*"
  logLevel: DEBUG
  # Base URL the ARAs use to call this ARS back with results (see
  # ARS_DEFAULT_HOST in _helpers.tpl). Leave EMPTY when the ARAs run in this
  # cluster, it then defaults to the internal FQDN, which resolves from any
  # namespace. Set it to the public URL (e.g. "https://ars.apps.renci.org")
  # only when the ARAs are genuinely outside the cluster; that routes callbacks
  # and proxy calls out through the ingress and back in.
  defaultHost: ""

secrets:
  # If set, no Secret is rendered and this pre-existing Secret is used instead.
  # It must contain the same keys the template creates (see templates/secret.yaml).
  existingSecret: ""
  # ------ dev-only defaults below ------
  djangoSecretKey: "ars-dev-insecure-secret-key-change-me"
  # base64-encoded 32-byte AES key (the app base64-decodes this; see tr_ars/tasks.py)
  aesMasterKey: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  mysqlRootPassword: "ars-dev-root-password"
  mysqlPassword: "ars-dev-password"
  rabbitmqPassword: "ars-dev-password"

arsserver:
  replicas: 1
  containerPort: 8000
  gunicorn:
    workerClass: gthread
    # Dev-sized. Production (deploy/values.yaml) runs 16x16; concurrency ~= workers * threads.
    workers: 4
    threads: 8
    timeout: 360
    gracefulTimeout: 120
    maxRequests: 1000
    maxRequestsJitter: 100
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

celeryworker:
  # Scale capacity with REPLICAS, not concurrency: merge tasks are memory-heavy
  # (multi-MB TRAPI messages), so concurrency multiplies peak memory inside one
  # pod's limit while replicas spread it. The redis expensive-token gate is
  # global across replicas, so total worker slots (replicas * concurrency)
  # should stay ABOVE expensiveGate.limit -- the gate then caps concurrent
  # merges cluster-wide and the surplus slots keep cheap tasks (client
  # notifications, timeout sweeps) from starving behind merges. Concurrency
  # only needs to cover HTTP wait time on annotator/appraiser calls; 8-10 is
  # plenty, and pod memory limit / concurrency bounds worst-case merge size.
  replicas: 1
  concurrency: 10
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

# Beat is always exactly 1 replica (a second scheduler would double-fire tasks)
celerybeat:
  # Beat's workload is tiny (one scheduler tick, catch_timeout every 3 min) but it
  # loads the same app image as the workers: Django + tr_ars.tasks/utils pulls in
  # reasoner-pydantic, biothings_annotator, zstandard and the OTEL instrumentation
  # for ~200MB RSS before it does anything. Anything under ~512Mi OOMs at import.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Global concurrency gate for expensive tasks (tr_sys/tr_sys/celery_gates/expensive_gate.py).
# The limit is cluster-wide (redis-backed), spanning all worker replicas. It only
# does anything while limit < celeryworker.replicas * concurrency; at the old
# defaults (12 tokens, 10 slots) it never bound. Dev default 8 leaves 2 of the
# 10 slots free for non-merge tasks.
expensiveGate:
  limit: "8"
  leaseMs: "180000"
  renewSec: "15"
  zkey: "ars:expensive_tokens"
  # Celery retry budget for contention (no free token, or the merge db lock is
  # held); constant 2-5s backoff between attempts, so ~6 min worst-case wait.
  taskMaxRetries: "100"

# merge_and_post_process retry tuning (tr_sys/tr_ars/utils.py)
merge:
  # Retry cap for real errors during merge, tracked separately from contention
  # retries; exponential backoff 1,2,4,8,16s then capped at 30s (~2 min total).
  errorMaxRetries: "8"

migrations:
  # Run `manage.py migrate` as a post-install/post-upgrade hook Job
  enabled: true
  # Same story as celerybeat: the job does almost no work but loads the whole
  # app (~200MB RSS) to run Django's migrate. Without an explicit request the
  # namespace LimitRange default applies, which is often small enough to OOM
  # the job before it reaches the database -- and a failed hook fails the release.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

mysql:
  # true: deploy a single-node MySQL StatefulSet (dev). false: use external.*
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  auth:
    database: arsdb
    username: ars
  persistence:
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  # Used when enabled=false (e.g. RDS). Password comes from the Secret either way.
  external:
    host: ""
    port: 3306
    database: arsdb
    username: ars

redis:
  # true: deploy a single Redis pod. false: use external.url
  enabled: true
  image:
    repository: redis
    tag: "6.2"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  external:
    # e.g. redis://my-elasticache.example:6379/0
    url: ""

rabbitmq:
  # true: deploy a single-node RabbitMQ StatefulSet with a persistent volume
  enabled: true
  image:
    repository: rabbitmq
    tag: "3.13"
    pullPolicy: IfNotPresent
  auth:
    # guest/guest only works over localhost, so a split-pod deploy needs a real user
    username: ars
  persistence:
    size: 4Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  external:
    host: ""
    port: 5672
    username: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ars.local
  path: /
  pathType: Prefix
  tls: []

# Applied to every pod in the release. Left empty so the chart schedules on any
# cluster; the production node pinning (application=ars label + transltr taint)
# lives in deploy/values.yaml and can be copied here per-environment.
affinity: {}
tolerations: []
nodeSelector: {}
